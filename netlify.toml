[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Growth OS scheduled jobs.
#
# THE EXECUTION LIMITS THAT SHAPE ALL OF THIS (Netlify, per function type):
#   synchronous ~10s  |  scheduled 30s  |  background 15min (`-background` suffix)
#
# A scheduled function is also NOT invocable over HTTP (404). So the two roles
# cannot share one function, and long work cannot live in either:
#   - growth-analyze-cron fires growth-analyze-background and returns instantly.
#     The analysis itself takes 20-40s (four Claude calls) and would blow the
#     30s scheduled cap - silently, every Monday.
#   - growth-compact-cron does its own work but caps days per run to stay well
#     inside 30s; a backlog drains over successive nights.
# See _growthRunAnalysis.mjs for the full topology.

# Rolls finished days of one-key-per-event blobs into one blob per day, so reads
# stay cheap as history accumulates. 03:15 UTC - after any plausible day
# boundary, and off-peak. Only ever touches days before today, so it cannot race
# a live write.
[functions."growth-compact-cron"]
  schedule = "15 3 * * *"

# The AI executive team. WEEKLY (Monday 06:00 UTC), deliberately not daily: at
# this platform's scale a daily brief would be narrating noise - day-over-day
# movement of 0-3 signups carries no information - and a system that cries wolf
# daily gets ignored within a fortnight. Weekly also keeps the whole AI layer to
# ~4 runs/month, well inside the cap enforced in _aiBudget.mjs.
[functions."growth-analyze-cron"]
  schedule = "0 6 * * 1"

# Phase 5 scheduled jobs. Both follow the same cron→background split as the two
# above, and for the same reason: a scheduled function is capped at 30s and is
# not HTTP-routable, so it fires a `-background` worker (15min) and returns.
#
# The schedules are also declared in each function's own `export const config`.
# Netlify accepts either; both are present because this file is where an operator
# looks to see what runs when, and the code is where a developer looks. They must
# agree — if you change one, change the other.

# Drains the durable outbox: receipts, transactional email, Telegram alerts,
# Watchtower enrolment. Every 5 minutes, off the :00/:15/:30/:45 grid the
# re-scan and alert pipeline already occupies.
[functions."queue-worker-cron"]
  schedule = "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

# Expiry reminders (30/7/1 days), the expiry transition itself, renewal nudges,
# and reconciliation of paid orders that never activated. Daily — everything it
# decides is measured in days.
[functions."verification-lifecycle-cron"]
  schedule = "10 7 * * *"

# Security headers (P1-3). Applied to every served path. These are all
# zero-breakage for a same-origin SPA:
#   - HSTS forces HTTPS for a year (Netlify already serves HTTPS-only).
#   - X-Frame-Options + CSP frame-ancestors 'self' stop clickjacking. Note the
#     embeddable "Verified by KHAN Trust" badge is an <img>/SVG, NOT an iframe,
#     so framing restrictions do not affect it.
#   - nosniff blocks MIME-confusion; Referrer-Policy trims referrer leakage;
#     Permissions-Policy disables device APIs the app never uses.
# A full resource-restricting CSP (script-src/connect-src/img-src covering GA,
# Stripe, CoinGecko widgets, and every data provider) is deliberately NOT set
# here yet - a wrong value silently breaks fetches and is being introduced as a
# separately verified step. frame-ancestors alone cannot break app resources.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "frame-ancestors 'self'"

# The private Growth OS console. Served from its own Vite entry (admin.html),
# so none of its code ships in the user bundle.
#
# Path-specific rewrite, consistent with every other redirect here - there is
# still no catch-all - so the public hash-routed SPA at "/" is untouched.
[[redirects]]
  from = "/console"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/console/*"
  to = "/admin.html"
  status = 200

# Defence in depth for the console surface. The passcode gate is the actual
# access control - these headers stop the console from being INDEXED or
# CACHED, which is a different problem: without them a crawler that ever sees
# /console can list it in search results, advertising that the system exists.
# That is the requirement these enforce ("users must never know this exists"),
# not authorisation.
[[headers]]
  for = "/console"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

# ── Phase 4 indexing rules: everything that must NOT be indexed ──────────────
#
# robots.txt (public/robots.txt) asks a crawler not to FETCH these. This header
# is what actually keeps them OUT OF THE INDEX, and the difference is the whole
# reason both exist: a Disallow'd URL that is linked from anywhere can still be
# listed — URL only, "no description available" — which for a private surface
# advertises its existence while telling the operator nothing is wrong.
#
# A header is also the only mechanism that works for the machine surfaces here.
# /badge-status and /og/* are not HTML and cannot carry a <meta name="robots">.

# Per-customer purchase receipts. Contains an order id, amounts and a payment
# reference; there is no version of this page that belongs in a search result.
[[headers]]
  for = "/receipt/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

# The sign-up entry point (referral links land here) and the email opt-out.
# Both are functional endpoints, not content, and both would be thin duplicates
# of "/" in an index.
[[headers]]
  for = "/signup"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/unsubscribe"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# The badge JSON transport. Public data, but a machine endpoint — indexing it
# would put raw verification JSON into search results for a project's name.
[[headers]]
  for = "/badge-status"
  [headers.values]
    X-Robots-Tag = "noindex"

# Every function invoked directly rather than through a clean path. This covers
# the payment, ownership-verification, admin and account endpoints in one rule,
# so a NEW endpoint is noindex by default rather than by somebody remembering to
# add it here. That default is the point: the failure mode this prevents is a
# future payment route being indexed because nobody thought about it.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Immutable caching for build output (Phase 3 perf). Everything under /assets/
# is content-hashed by Vite (e.g. react-vendor-Cw1fZvOf.js) - a changed file
# always gets a new name - so it is safe to cache forever. Without this the
# hashed chunks were served max-age=0,must-revalidate, forcing a revalidation
# request for every chunk on every visit and defeating the vendor-split caching.
# index.html itself is NOT matched here, so it keeps revalidating and always
# points at the current hashed assets after a deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SEO surface (Direction 2). These are ADDITIVE, path-specific rewrites only -
# there is deliberately NO catch-all "/*" redirect, so the existing hash-routed
# SPA (served as the static index.html at "/") is completely untouched. Status
# 200 = transparent rewrite, so the clean /token/<contract> and /sitemap.xml
# URLs are what users and crawlers see.
#
# The /token/* surface is fronted by the edge function
# netlify/edge-functions/token-router.js, which runs BEFORE these redirects and
# does User-Agent negotiation: human browsers get the React SPA at the same URL,
# link-preview crawlers get this function's SEO/OG HTML. This redirect remains
# as an explicit fallback (and for direct ?contract= calls) — if the edge layer
# is ever unavailable, /token/<contract> still resolves to server-rendered HTML
# rather than 404ing. The function reads the contract from the path or the
# ?contract= query (see resolveContract in token-page.mjs).
[[redirects]]
  from = "/token/:contract"
  to = "/.netlify/functions/token-page?contract=:contract"
  status = 200

# ── Phase 4: the public token profile ────────────────────────────────────────
#
# /t/<chain>/<contract> is now THE canonical token page, and /token/<contract>
# (above) 301s to it — see src/lib/publicProfile.js for why the chain segment is
# not optional (the same 0x address is a different token on seven EVM chains,
# and the old URL could not resolve any of them).
#
# Status 200 = transparent rewrite, so the clean URL is what users, crawlers and
# social platforms see. Still additive and path-specific: there is deliberately
# no catch-all "/*", so the hash-routed SPA at "/" is untouched.
#
# NO EDGE FUNCTION and no User-Agent negotiation on this path, unlike /token/*.
# Everyone gets the same server-rendered HTML — a crawler, a human, and a human
# with JavaScript disabled. Serving different bytes to different visitors on a
# page that asserts someone's verification status is the wrong shape; see the
# header of netlify/functions/token-profile.mjs.
[[redirects]]
  from = "/t/:chain/:contract"
  to = "/.netlify/functions/token-profile"
  status = 200

# The social share card for a profile. Kept on its own path rather than a query
# parameter so it can be cached, purged and (if it ever needs to be) served from
# a different origin independently of the page.
[[redirects]]
  from = "/og/t/:chain/:contract"
  to = "/.netlify/functions/profile-og"
  status = 200

# The purchase receipt. Server-rendered so it is readable, printable and
# linkable from an email with no application shell to boot first — and noindex'd
# below, because it is per-customer.
[[redirects]]
  from = "/receipt/:orderId"
  to = "/.netlify/functions/receipt-page"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Verification-as-Network (Direction 4): embeddable "Verified by KHAN Trust"
# badge SVG. Additive, path-specific - no catch-all.
#
# TWO SHAPES, because the two callers know different things.
#
# /badge/<chain>/<contract> is the form a project embeds on their own site: an
# external owner knows their contract address and has no reason to know a KHAN
# Trust project id. Declared FIRST because it is the canonical one going
# forward. Two path segments, so it cannot collide with the single-segment rule
# below.
#
# /badge/<projectId> is the original. It stays because embeds using it are
# already live on other people's websites and a published URL is a promise -
# the same rule src/lib/routes.js states for the SPA's route aliases.
#
# Netlify preserves the query string through a rewrite, so the JS widget's
# ?contract=&chain= form reaches the function through either path.
[[redirects]]
  from = "/badge/:chain/:contract"
  to = "/.netlify/functions/verify-badge?chain=:chain&contract=:contract"
  status = 200

[[redirects]]
  from = "/badge/:projectId"
  to = "/.netlify/functions/verify-badge?projectId=:projectId"
  status = 200

# JSON transport of the same badge state, read cross-origin by /badge.js on
# third-party sites. Same data, same resolver (_badgeState.mjs), same cache
# policy - a script cannot read pixels, which is the only reason it is separate.
[[redirects]]
  from = "/badge-status"
  to = "/.netlify/functions/verify-badge-status"
  status = 200

# Lifecycle email opt-out. The footer link people actually see and hover over,
# so it should look like the product rather than like /.netlify/functions/... —
# an opt-out that looks untrustworthy gets replaced by the spam button, which
# costs the sending domain far more than the unsubscribe does. Additive and
# path-specific, like every redirect here; still no catch-all.
#
# The machine-readable RFC 8058 List-Unsubscribe header deliberately does NOT
# use this path — it points straight at the function, so the unattended
# one-click POST never depends on redirect handling. See _lifecycleTemplates.mjs.
[[redirects]]
  from = "/unsubscribe"
  to = "/.netlify/functions/lifecycle-unsubscribe"
  status = 200

# Referral & Invite System: the public invite link is /signup?ref=<CODE>.
# /signup is not a real file, so without this it 404s. A transparent rewrite
# (status 200, query string preserved by Netlify) serves the hash-routed SPA,
# whose client reads ?ref= from window.location.search on load, stores the
# first-touch code, and opens the sign-up modal. Additive and path-specific -
# still no catch-all, so the SPA at "/" stays untouched.
[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200
